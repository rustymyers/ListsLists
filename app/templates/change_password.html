{% extends "base.html" %}{% block content %}<section class="card narrow"><h1>Change password</h1>{% if user.must_change_password %}<p>A password change is required before API access.</p>{% else %}<label>Current password<input type="password" name="current_password" form="change-password" required></label>{% endif %}<form method="post" id="change-password"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><label>New password<input type="password" name="password" minlength="12" required></label><button>Save password</button></form></section>{% endblock %}
