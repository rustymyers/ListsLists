{% extends "base.html" %}{% block title %}Items · ListsLists{% endblock %}{% block content %}
<div class="heading"><div><h1>Items</h1><p>Manage the canonical items shared across your lists.</p></div><form method="get" action="/items"><input type="hidden" name="q" value="{{ q }}">{% if view == "cards" %}<button class="secondary" name="view" value="table">Table view</button>{% else %}<button class="secondary" name="view" value="cards">Card view</button>{% endif %}</form></div>
<details class="card"><summary>Create an item</summary><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><div class="form-grid"><label>Name<input name="name" required autofocus></label><label>Unit<input name="unit" value="each" required></label><label>Category<input name="category"></label><label>Tags (comma-separated)<input name="tags"></label><label>Storage location<input name="storage_location"></label><label>Usage context<input name="usage_context"></label><label>Identity key<input name="identity_key"></label></div><label>Description<textarea name="description"></textarea></label><label>Notes<textarea name="notes"></textarea></label><button>Create item</button></form></details>
<form class="search" action="/items" method="get"><input type="hidden" name="view" value="{{ view }}"><input name="q" value="{{ q }}" placeholder="Search items" hx-get="/items" hx-include="closest form" hx-target="#item-results" hx-swap="outerHTML" hx-trigger="input changed delay:250ms, search"><button>Search</button></form>
{% include "item_cards.html" %}
{% endblock %}
