{% extends "base.html" %}{% block content %}<h1>History: {{ list.name }}</h1><section class="card"><table><thead><tr><th>When</th><th>Action</th><th>Actor</th><th>Details</th></tr></thead><tbody>{% for event in events %}<tr><td>{{ event.created_at }}</td><td>{{ event.action }}</td><td>{{ event.actor.username if event.actor else 'system' }}</td><td><code>{{ event.details }}</code></td></tr>{% else %}<tr><td colspan="4">No events yet.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
