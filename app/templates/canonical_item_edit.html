{% extends "base.html" %}{% block title %}Edit {{ item.name }} · Items{% endblock %}{% block content %}
<section class="card"><h1>Edit {{ item.name }}</h1><p>Changes apply to every list that uses this item.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><div class="form-grid"><label>Name<input name="name" value="{{ item.name }}" required></label><label>Unit<input name="unit" value="{{ item.unit }}" required></label><label>Category<input name="category" value="{{ item.category or '' }}"></label><label>Tags (comma-separated)<input name="tags" value="{{ item.tags|join(', ') }}"></label><label>Storage location<input name="storage_location" value="{{ item.storage_location or '' }}"></label><label>Usage context<input name="usage_context" value="{{ item.usage_context or '' }}"></label><label>Identity key<input name="identity_key" value="{{ item.identity_key or '' }}"></label></div><label>Description<textarea name="description">{{ item.description }}</textarea></label><label>Notes<textarea name="notes">{{ item.notes }}</textarea></label><div class="actions"><button>Save changes</button><a class="button secondary" href="/items/{{ item.id }}">Cancel</a></div></form></section>
{% endblock %}
