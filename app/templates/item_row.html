<tr id="item-{{ item.id }}"><td><strong>{{ item.name }}</strong>{% if item.referenced_list_id %}<span class="pill">nested</span>{% endif %}<small>{{ item.notes }}</small></td><td>{{ item.quantity|round(4) }} {{ item.unit }}</td><td>{{ item.category or '' }}</td><td>{{ item.storage_location or '' }}</td><td>{% for tag in item.tags %}<span class="tag">{{ tag }}</span>{% endfor %}</td><td>{% if can_edit %}<a class="link" href="/items/{{ item.id }}/edit">Edit</a><form hx-post="/items/{{ item.id }}/delete" hx-target="#item-{{ item.id }}" hx-swap="outerHTML" hx-confirm="Remove item?"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><button class="link danger-text">Remove</button></form>{% endif %}</td></tr>
