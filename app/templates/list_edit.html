{% extends "base.html" %}{% block content %}<section class="card"><h1>Edit {{ list.name }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><label>Name<input name="name" value="{{ list.name }}" required></label><label>Description<textarea name="description">{{ list.description }}</textarea></label><label>Visibility<select name="visibility">{% for value in ['private','shared','unlisted','public'] %}<option value="{{ value }}" {% if list.visibility.value == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><label class="check"><input type="checkbox" name="archived" {% if list.archived %}checked{% endif %}> Archived</label><button>Save</button></form></section>{% endblock %}
