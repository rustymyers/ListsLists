<div id="list-results" class="grid">{% for list in lists %}<article class="card"><span class="pill">{{ list.visibility.value }}</span><h2><a href="/l/{{ list.slug }}">{{ list.name }}</a></h2><p>{{ list.description or "No description" }}</p><small>Updated {{ list.updated_at.strftime('%Y-%m-%d %H:%M') }}</small></article>{% else %}<div class="empty">No lists found.</div>{% endfor %}</div>
