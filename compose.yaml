services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    environment:
      LISTSLISTS_ENVIRONMENT: production
      LISTSLISTS_DATABASE_URL: postgresql+psycopg://listslists:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db/listslists
      LISTSLISTS_SECRET_KEY: ${LISTSLISTS_SECRET_KEY:?set LISTSLISTS_SECRET_KEY}
      LISTSLISTS_PUBLIC_BASE_URL: ${LISTSLISTS_PUBLIC_BASE_URL:-http://localhost:8000}
      LISTSLISTS_DATA_DIR: /data
      LISTSLISTS_AUTH_MODE: ${LISTSLISTS_AUTH_MODE:-local}
      LISTSLISTS_BOOTSTRAP_ADMIN_PASSWORD: ${LISTSLISTS_BOOTSTRAP_ADMIN_PASSWORD:-}
      LISTSLISTS_TRUSTED_PROXY_CIDRS: ${LISTSLISTS_TRUSTED_PROXY_CIDRS:-}
      LISTSLISTS_SESSION_HTTPS_ONLY: ${LISTSLISTS_SESSION_HTTPS_ONLY:-false}
      LISTSLISTS_SMTP_HOST: ${LISTSLISTS_SMTP_HOST:-}
      LISTSLISTS_SMTP_PORT: ${LISTSLISTS_SMTP_PORT:-587}
      LISTSLISTS_SMTP_USERNAME: ${LISTSLISTS_SMTP_USERNAME:-}
      LISTSLISTS_SMTP_PASSWORD: ${LISTSLISTS_SMTP_PASSWORD:-}
      LISTSLISTS_MAIL_FROM: ${LISTSLISTS_MAIL_FROM:-listslists@localhost.local}
    volumes:
      - app_data:/data
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: listslists
      POSTGRES_USER: listslists
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listslists -d listslists"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  app_data:
  postgres_data:
