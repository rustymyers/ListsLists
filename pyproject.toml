[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "listslists"
version = "1.0.0"
description = "Self-hosted contextual lists with reusable nested lists"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "itsdangerous>=2.2,<3",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]
